name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          test -f main.js
          test -f manifest.json
          test "${GITHUB_REF_NAME}" = "$(node -p "require('./manifest.json').version")"
          grep -q '"id": "daily-checkbox-focus"' manifest.json
          grep -q "\"version\": \"${GITHUB_REF_NAME}\"" manifest.json

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          cp main.js manifest.json release-assets/
          if [ -f styles.css ]; then
            cp styles.css release-assets/
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: release-assets/*
